services:
  paises_api:
    build: ./app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:rw   # persistencia (csv/json)
    restart: unless-stopped

  # --- PREPROCESO G2: normaliza AUTOS (evitar pulls, reutiliza imagen local) ---
  preprocess-g2:
    image: paises-apis:local
    entrypoint: ["python"]
    command: ["/scripts/normalize_csv.py","/work/raw.csv","/work/columns.map.json","/work/paises.csv"]
    volumes:
      - ./scripts:/scripts:ro
      - ./datasets/g2:/work
    restart: "no"

  # --- API G2 en 8010 ---
  api-g2:
    image: paises-apis:local
    container_name: paises-api-g2
    env_file: .env.g2
    ports:
      - "8010:8000"
    volumes:
      - ./data/g2:/app/data
      - ./datasets/g2/paises.csv:/app/data/paises.csv:ro
    depends_on:
      preprocess-g2:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # endurecimiento opcional:
    # read_only: true
    # tmpfs: ["/tmp"]

  # --- PREPROCESO G3: normaliza COLEGIOS ---
  preprocess-g3:
    image: paises-apis:local
    entrypoint: ["python"]
    command: ["/scripts/normalize_csv.py","/work/raw.csv","/work/columns.map.json","/work/paises.csv"]
    volumes:
      - ./scripts:/scripts:ro
      - ./datasets/g3:/work
    restart: "no"

  # --- API G3 en 8020 ---
  api-g3:
    image: paises-apis:local
    container_name: paises-api-g3
    env_file: .env.g3
    ports:
      - "8020:8000"
    volumes:
      - ./data/g3:/app/data
      - ./datasets/g3/paises.csv:/app/data/paises.csv:ro
    depends_on:
      preprocess-g3:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # read_only: true
    # tmpfs: ["/tmp"]

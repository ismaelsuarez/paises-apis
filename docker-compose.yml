services:
  paises_api:
    build: ./app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:rw   # persistencia (csv/json)
    restart: unless-stopped

  # --- API G2 en 8010 (autos) ---
  api-g2:
    image: paises-apis:local
    container_name: paises-api-g2
    env_file: .env.g2
    ports:
      - "8010:8000"
    volumes:
      - ./data/g2:/app/data
      - ./datasets/g2/raw.csv:/app/data/autos.csv:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # endurecimiento opcional:
    # read_only: true
    # tmpfs: ["/tmp"]

  # --- API G3 en 8020 (colegios) ---
  api-g3:
    image: paises-apis:local
    container_name: paises-api-g3
    env_file: .env.g3
    ports:
      - "8020:8000"
    volumes:
      - ./data/g3:/app/data
      - ./datasets/g3/raw.csv:/app/data/colegios.csv:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # read_only: true
    # tmpfs: ["/tmp"]
